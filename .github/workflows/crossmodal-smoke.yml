name: Crossmodal zero-cost smoke test

on:
  push:
    branches:
      - crossmodal-audit-runner
    paths:
      - "crossmodal_audit/**"
      - ".github/workflows/crossmodal-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gradio_client
      - name: Run free-space API smoke test
        run: python crossmodal_audit/smoke_gradio_api.py
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossmodal-api-smoke-outputs
          path: crossmodal_audit/api_smoke_outputs/
          if-no-files-found: warn
